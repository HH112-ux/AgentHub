name: Feature request
description: 提出 AgentHub 的新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认没有重复建议，并说明希望解决的问题，而不仅是实现方案。
  - type: textarea
    id: problem
    attributes:
      label: 问题与场景
      description: 谁在什么场景下遇到什么问题？为什么现有能力不足？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望结果
      description: 希望产品表现出什么行为？如何判断改进有效？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式或现有替代能力？
  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 涉及哪些模块、页面、接口、权限或部署配置？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认不是重复建议。
          required: true
        - label: 我没有在描述中包含密钥、业务数据或个人敏感信息。
          required: true
