name: CI

# 交付门禁：合入 main 前必须通过的最低集合。
# 档位取自「最小可绿」——规则类检查恒定执行；后端/前端/契约/部署作业在对应制品入仓前自动跳过，
# 制品出现后无需改本文件即自动生效。接口 e2e 全量硬门禁与 JaCoCo 覆盖率仍属后续硬化项，未在此提前。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 双方言 SQL 一致性与幂等
        run: node scripts/checks/schema-dialect-parity.mjs

      # §12.4 保留窗口是运行期可改的配置，改小一天就等于少留一天；分批上限、父子联动与两档留痕同属 §12.4，改一条就悄悄失效（§12.7 I-5 / I-6 / I-7）。
      - name: 审计保留策略（下限 / 分批 / 联动）
        run: node scripts/checks/audit-retention-guards.mjs

      # §12.5 的「操作他人会话必填理由并写底座操作日志」分处控制器、服务层与前端三处，理由丢一处、@Log 被摘、校验挪到删除之后，功能回归全都看不出来（§12.7 I-9）。
      - name: 会话治理留痕（理由 / 归属 / 收痕）
        run: node scripts/checks/session-governance-reason.mjs

      # §12.6 的附件回收会真删对象存储里的文件：扫描丢了状态谓词就删掉正在查看的附件，登记丢了期限就永远扫不到。两类错位都只在接上真实库与桶后才暴露（§12.7 I-10）。
      - name: 附件生命周期（状态机 / 配额 / 到期回收）
        run: node scripts/checks/attachment-lifecycle-guards.mjs

      # §12.2 的版本恢复会整篇覆盖用户长期记忆且历史只增不删：权限标识、菜单登记、@Log 留痕、服务层确认判据与前端勾选分处五个文件，
      # 少任一处都不报错——注解退回「记忆修改」等于人人可覆盖，判据挪到自动快照之后则被拒请求也留下了版本行（§12.7 I-11）。
      - name: 记忆版本恢复（独立权限 / 二次确认 / 留痕）
        run: node scripts/checks/memory-version-restore.mjs

      - name: 文件与目录命名规范
        run: node scripts/checks/naming-convention.mjs

      - name: 密钥入库防护
        run: node scripts/checks/no-secrets-in-repo.mjs

      - name: 文档交叉引用
        run: node scripts/checks/doc-links.mjs

      # 恒定执行：CI 是全新检出，被忽略的文件根本不在工作树里，所以真正起作用的是「未锚定模式」这条静态断言。
      - name: gitignore 卫生
        run: node scripts/checks/gitignore-hygiene.mjs

      - name: 探测已入仓的构建工件
        id: probe
        run: |
          test_true() { [ -e "$1" ] && echo true || echo false; }
          {
            echo "backend=$(test_true code/back-end/pom.xml)"
            echo "frontend=$(test_true code/front-end/package.json)"
            echo "contract=$(test_true e2e/http/L00-contract-consistency.mjs)"
            echo "deploy=$(test_true deploy/deploy-pg/docker-compose.yml)"
          } >> "$GITHUB_OUTPUT"

      # 部署门禁与本地同一入口：脚本自带「无 docker 则跳过渲染、静态断言照跑」的降级，故无需在此探测。
      - name: 部署编排校验
        if: steps.probe.outputs.deploy == 'true'
        run: node scripts/checks/deploy-static.mjs

      - name: Nginx 入口配置语法
        if: steps.probe.outputs.deploy == 'true'
        run: |
          # nginx -t 会真去加载 ssl_certificate，证书不入库（§2.3.1），因此现签一份一次性的放临时目录。
          cert=$RUNNER_TEMP/cert
          mkdir -p "$cert"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$cert/agenthub.key" -out "$cert/agenthub.crt" -subj "/CN=agenthub.test" 2>/dev/null
          for stack in pg mysql; do
            # app 是栈内服务名，CI 里没有 DNS，不预置解析则 nginx -t 在 upstream 阶段就失败。
            docker run --rm --add-host app:127.0.0.1 \
              -v "$GITHUB_WORKSPACE/deploy/deploy-$stack/nginx/agenthub.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$cert:/etc/nginx/cert:ro" \
              nginx:1.27 nginx -t
          done

      # JDK 与 Node 版本一律取自仓库内声明，CI 不硬编码版本，避免与设计稿 §11 前置的底座制品版本漂移。
      - name: 解析 JDK 版本
        if: steps.probe.outputs.backend == 'true'
        id: jdk
        run: |
          if [ -f code/back-end/.java-version ]; then
            version=$(tr -d '[:space:]' < code/back-end/.java-version)
          else
            version=$(sed -n 's:.*<java\.version>\([0-9][0-9.]*\)</java\.version>.*:\1:p' code/back-end/pom.xml | head -1)
          fi
          if [ -z "$version" ]; then
            echo "::error::未从 code/back-end/.java-version 或根 pom.xml 的 <java.version> 解析到 JDK 版本，请补齐其一"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 装配 JDK
        if: steps.probe.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}
          cache: maven

      - name: AI 模块单测
        if: steps.probe.outputs.backend == 'true'
        working-directory: code/back-end
        # -am 必需：CI 为全新检出，本地仓库无同级模块制品，只 -pl 单模块会解析失败。
        run: |
          if [ -x ./mvnw ]; then MVN=./mvnw; else MVN=mvn; fi
          "$MVN" -B -ntp -pl ruoyi-modules/agent-hub-ai -am test

      # 只在前端在架时跑：菜单 component 是运行期字符串，写错只在点开菜单时白屏；前端不在架时只剩空断言，跳过比假装通过诚实。
      # 排在构建之前，避免构建失败连带跳过这条与打包无关的静态对齐。
      - name: 菜单 component 与前端页面对齐
        if: steps.probe.outputs.frontend == 'true'
        run: node scripts/checks/menu-component.mjs

      - name: 装配 pnpm
        if: steps.probe.outputs.frontend == 'true'
        uses: pnpm/action-setup@v4
        with:
          # 前端不在仓库根，action 默认只读根 package.json 的 packageManager，指过去才不会「No pnpm version is specified」。
          package_json_file: code/front-end/package.json

      - name: 装配 Node
        if: steps.probe.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: code/front-end/.node-version
          cache: pnpm
          cache-dependency-path: code/front-end/pnpm-lock.yaml

      - name: 安装前端依赖
        if: steps.probe.outputs.frontend == 'true'
        working-directory: code/front-end
        run: pnpm install --frozen-lockfile

      - name: 前端 lint
        if: steps.probe.outputs.frontend == 'true'
        working-directory: code/front-end
        run: pnpm lint

      - name: 前端构建
        if: steps.probe.outputs.frontend == 'true'
        working-directory: code/front-end
        run: |
          # .env.production 只保留占位符；CI 现签一次性密钥对验证构建注入路径，避免把占位符打进 dist。
          # 进程环境变量优先级高于 .env 文件（Vite 约定），export 即生效。
          one() { grep -v -- '-----' "$1" | tr -d '\n'; }
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/rsa.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/rsa.pem" -pubout -out "$RUNNER_TEMP/rsa.pub" 2>/dev/null
          export VITE_APP_RSA_PUBLIC_KEY="$(one "$RUNNER_TEMP/rsa.pub")"
          export VITE_APP_RSA_PRIVATE_KEY="$(one "$RUNNER_TEMP/rsa.pem")"
          pnpm build

      # 复验紧跟在构建之后：扫描刚产出的 dist，命中 .env.production 中的占位符或示例密钥即红。
      - name: dist 占位密钥复验
        if: steps.probe.outputs.frontend == 'true'
        run: node scripts/checks/dist-rsa.mjs

      - name: 介绍页问答 Function 单测
        run: node --test code/intro-site/tests/chat.test.mjs

      - name: 契约一致性
        if: steps.probe.outputs.contract == 'true'
        run: node e2e/http/L00-contract-consistency.mjs

      - name: 门禁覆盖小结
        if: ${{ !cancelled() }}
        env:
          # 经 env 传入而非直接插值进 shell，遵循 actions 的脚本注入防护惯例。
          BACKEND: ${{ steps.probe.outputs.backend }}
          FRONTEND: ${{ steps.probe.outputs.frontend }}
          CONTRACT: ${{ steps.probe.outputs.contract }}
          DEPLOY: ${{ steps.probe.outputs.deploy }}
        run: |
          state() { [ "$1" = 'true' ] && echo 已执行 || echo "跳过：$2"; }
          {
            echo "### CI 门禁覆盖"
            echo ""
            echo "| 门禁 | 本次状态 |"
            echo "|---|---|"
            echo "| 双方言 SQL 一致性与幂等 | 恒定执行 |"
            echo "| 审计保留策略（§12.4 / I-5 / I-6 / I-7） | 恒定执行 |"
            echo "| 会话治理留痕（§12.5 / I-9） | 恒定执行 |"
            echo "| 附件生命周期（§12.6 / I-10：状态机 / 配额 / 到期回收） | 恒定执行 |"
            echo "| 记忆版本恢复（§12.2 / I-11：独立权限 / 二次确认 / 留痕） | 恒定执行 |"
            echo "| 文件与目录命名规范（§3.2） | 恒定执行 |"
            echo "| 密钥入库防护（仓库 public） | 恒定执行 |"
            echo "| 文档交叉引用（绝对链接/死链/锚点） | 恒定执行 |"
            echo "| gitignore 卫生（源码不被忽略规则吃掉） | 恒定执行 |"
            echo "| 部署编排校验（§4 静态断言 + compose 渲染） | $(state "$DEPLOY" 'deploy/deploy-pg/docker-compose.yml 未入仓') |"
            echo "| Nginx 入口配置语法（nginx -t） | $(state "$DEPLOY" 'deploy/ 未入仓') |"
            echo "| AI 模块单测 | $(state "$BACKEND" 'code/back-end/pom.xml 未入仓') |"
            echo "| 菜单 component ↔ 前端页面文件 | $(state "$FRONTEND" 'code/front-end 未入仓') |"
            echo "| 前端 lint / 构建 | $(state "$FRONTEND" 'code/front-end 未入仓') |"
            echo "| dist 占位 RSA 密钥复验 | $(state "$FRONTEND" 'code/front-end/package.json 未入仓') |"
            echo "| 介绍页问答 Function 单测 | 恒定执行 |"
            echo "| 契约一致性 L00 | $(state "$CONTRACT" 'e2e/http/L00-contract-consistency.mjs 未入仓') |"
            echo ""
            echo "> 接口 e2e 分层、浏览器巡检、RAG 评测需真实栈与模型密钥，按设计稿 §9 H1 留作后续流水线硬化。"
          } >> "$GITHUB_STEP_SUMMARY"
