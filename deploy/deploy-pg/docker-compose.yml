# AgentHub PG 栈编排——设计稿 §2.1 各层位置、§2.3 部署与安全约束、§3.2 部署命名行；端口口径见手册 §10.1。
# 双栈在同一台云服务器并存：本栈对外 80/443、后端 8080；MySQL 栈为 81/8443、8081。
# 中间件端口一律不发布到宿主机（§2.3.9 公网暴露收敛），进公网的只有 Nginx。
# 前置：同目录 .env（由 .env.example 复制）；app 镜像需要 B 线在 code/back-end 落 Dockerfile 后才能 --build。
name: agenthub-pg

# 运行期配置只走两条路：本段注入 AGENTHUB_* 环境变量，config/ 目录挂载属性路径映射。
# 底座自带 application-prod.yml 一行不改；实测见 docs/configuration.md「配置覆盖优先级」。
x-app-environment: &app-environment
  TZ: ${AGENTHUB_TZ:-Asia/Shanghai}
  # agenthub profile 必须排在 prod 之后：额外挂载目录 + 后置 profile 才压得动 classpath 明文默认值。
  SPRING_PROFILES_ACTIVE: ${AGENTHUB_SPRING_PROFILES_ACTIVE:-prod,agenthub}
  SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/config/

  # ↓ 以下由 config/application-agenthub.yml 映射到底座既有属性路径（数据源、Redis、JWT、接口加解密）。
  AGENTHUB_DATASOURCE_URL: ${AGENTHUB_DATASOURCE_URL:-jdbc:postgresql://db:5432/${POSTGRES_DB}?useUnicode=true&characterEncoding=utf8&useSSL=false&autoReconnect=true&reWriteBatchedInserts=true}
  AGENTHUB_DATASOURCE_USERNAME: ${POSTGRES_USER}
  AGENTHUB_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  AGENTHUB_REDIS_HOST: redis
  AGENTHUB_REDIS_PORT: "6379"
  AGENTHUB_REDIS_PASSWORD: ${REDIS_PASSWORD}
  AGENTHUB_SA_TOKEN_JWT_SECRET_KEY: ${AGENTHUB_SA_TOKEN_JWT_SECRET_KEY:?生产必须替换底座默认 abcdefghijklmnopqrstuvwxyz}
  AGENTHUB_API_DECRYPT_PUBLIC_KEY: ${AGENTHUB_API_DECRYPT_PUBLIC_KEY:?生产必须替换仓库内明文公钥}
  AGENTHUB_API_DECRYPT_PRIVATE_KEY: ${AGENTHUB_API_DECRYPT_PRIVATE_KEY:?生产必须替换仓库内明文私钥}

  # ↓ AgentHub 自有配置，由 agent-hub-ai 侧属性类读取。
  # 生效里程碑：根密钥与守卫模式＝A2/A5（本周 D2）；向量库与对象存储＝A4 RAG 与附件（D3）。
  # 属性路径由我们在代码里声明，不借用底座键名，故不进 config/ 映射文件。
  AGENTHUB_AI_CRYPTO_KEY: ${AGENTHUB_AI_CRYPTO_KEY:?模型密钥密文根密钥，见手册 §10.2 第 4 项}
  AGENTHUB_SECURITY_GUARD_MODE: ${AGENTHUB_SECURITY_GUARD_MODE:-prod}
  AGENTHUB_AI_CHAT_CURRENT_TIME_ZONE: ${AGENTHUB_AI_CHAT_CURRENT_TIME_ZONE:-Asia/Shanghai}
  AGENTHUB_MILVUS_URI: http://milvus:19530
  AGENTHUB_MILVUS_PASSWORD: ${MILVUS_PASSWORD}
  AGENTHUB_OBJECT_STORAGE_ENDPOINT: http://minio:9000
  AGENTHUB_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
  AGENTHUB_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?见 .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?见 .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产必须替换}
      TZ: ${AGENTHUB_AI_CHAT_CURRENT_TIME_ZONE:-Asia/Shanghai}
    volumes:
      - agenthub-pg-db:/var/lib/postgresql/data
      # initdb 按文件名顺序执行：底座基线 → AI 表结构 → 种子 → 菜单。
      # 底座基线由 B 线导入后放到 RY_BASE_SQL 指向的路径；未导入时挂 /dev/null 跳过，栈照样起。
      - ${RY_BASE_SQL:-/dev/null}:/docker-entrypoint-initdb.d/10-ry-base.sql:ro
      - ../../code/back-end/script/sql/postgres/agenthub-ai-ddl.sql:/docker-entrypoint-initdb.d/20-agenthub-ai-ddl.sql:ro
      - ../../code/back-end/script/sql/postgres/agenthub-ai-seed.sql:/docker-entrypoint-initdb.d/30-agenthub-ai-seed.sql:ro
      - ../../code/back-end/script/sql/postgres/agenthub-ai-menu.sql:/docker-entrypoint-initdb.d/40-agenthub-ai-menu.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?生产必须替换}
    volumes:
      - agenthub-pg-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls=http://0.0.0.0:2379", "--data-dir", "/etcd"]
    volumes:
      - agenthub-pg-etcd:/etcd
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?见 .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?生产必须替换}
    volumes:
      - agenthub-pg-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.5
    command: ["milvus", "run", "standalone"]
    environment:
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_SUPERUSERS: root
      MILVUS_USERNAME: root
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:?生产必须替换}
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - agenthub-pg-milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9091' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  app:
    build:
      context: ../../code/back-end
      dockerfile: ${AGENTHUB_APP_DOCKERFILE:-Dockerfile}
    image: ${AGENTHUB_APP_IMAGE:-agenthub/app:local}
    environment: *app-environment
    volumes:
      # 配置覆盖目录：只放 application-agenthub.yml，密钥值一律留在 .env。
      - ./config:/config:ro
      - agenthub-pg-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    # 8080 只在栈内被 Nginx 反代；宿主机映射供本地开发机直连，可按防火墙策略只放行内网。
    expose:
      - "8080"
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    healthcheck:
      # 健康自检 GET /ai/health/check 需 ai:health:check 鉴权（§12.3），容器探针只做端口就绪判断。
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  web:
    image: nginx:1.27
    volumes:
      - ./nginx/agenthub.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_DIST:-../../code/front-end/dist}:/usr/share/nginx/html:ro
      - ${CERT_DIR:-./cert}:/etc/nginx/cert:ro
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agenthub-pg-db:
  agenthub-pg-redis:
  agenthub-pg-etcd:
  agenthub-pg-minio:
  agenthub-pg-milvus:
  agenthub-pg-logs:
