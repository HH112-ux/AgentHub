# AgentHub MySQL 栈同源入口——设计稿 §2.1「前端与 API 由云服务器 Nginx 同源提供」、§2.3.9 公网暴露收敛。
# 只有本文件里的 81/8443 对宿主机发布；app、db、redis、milvus 一律不出网。
# 静态目录与证书目录由 deploy-mysql/docker-compose.yml 挂到这两个固定路径，不要改这里。

# 连接数护栏必须在 http 上下文声明，故置于 server 块之外；用法见下方 limit_conn。
# 单 IP 与单机各一条，防止公网直打 SSE 长连接耗尽 worker。
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn_zone $server_name zone=perserver:10m;

upstream agenthub_app {
    # 会话保持：SSE 断线重连与 HITL 确认卡片还原依赖同一实例。
    ip_hash;
    server app:8081;
}

# HTTP 只做两件事：证书链可达 + 强制跳转 HTTPS（§11 HTTPS 前置）。
server {
    listen 81;
    server_name _;

    # 只做 Nginx 自身存活探测：应用级自检 GET /ai/health/check 需 ai:health:check 鉴权（§12.3），
    # 不能挂在无鉴权入口上。证书未就位时 443 起不来，这条仍可确认 80 在跑。
    location = /healthz {
        access_log off;
        return 200 "agenthub-mysql-nginx-ok\n";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/cert/agenthub.crt;
    ssl_certificate_key /etc/nginx/cert/agenthub.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 版本号不外泄；附件与批量导入按 100m 上限放行（暂存件回收与配额在库侧管）。
    server_tokens off;
    client_max_body_size 100m;
    client_body_buffer_size 512k;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端产物：带 hash 的资源长期缓存，index.html 必须不缓存，否则发版后拿旧包。
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 监控探针入口：只证明 TLS 与 Nginx 在跑，不代替应用级健康自检。
    location = /healthz {
        access_log off;
        return 200 "agenthub-mysql-nginx-ok\n";
    }

    # actuator 只允许栈内访问，公网一律 403（§2.3.9）。
    location ~ ^(/[^/]*)?/actuator.*(/.*)?$ {
        return 403;
    }

    # 系统 API：同源前缀 /prod-api，SSE 与长任务共用同一处转发参数。
    location /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 一轮 Agent 对话含多次专家调用与 HITL 等待，读超时给到 24 小时。
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;

        # 流式必须关缓冲与缓存，否则 text_delta 会被攒成一次性返回。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_pass http://agenthub_app/;
    }

    # MCP 出口：底座默认端点 /mcp，与系统 API 同进程同端口。
    location /mcp {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        proxy_pass http://agenthub_app/mcp;
    }

    # 渠道回调（飞书/企微/GitHub Webhook）走独立前缀，便于按渠道单独放行与限流。
    location /prod-api/ai/channel/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_conn perip 20;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_pass http://agenthub_app/ai/channel/;
    }
}
