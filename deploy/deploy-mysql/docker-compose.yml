# AgentHub MySQL 栈编排——与 PG 栈同机并存（设计稿 §2.1 双栈、§2.3 安全约束、§3.2 部署命名行）。
# 本栈对外 81/8443、后端 8081；PG 栈为 80/443、8080。中间件端口一律不发布到宿主机（§2.3.9）。
# 前置：同目录 .env（由 .env.example 复制）；app 镜像由 code/back-end/Dockerfile 两阶段构建，`--build` 即可产出。
name: agenthub-mysql

# 运行期配置只走两条路：本段注入 AGENTHUB_* 环境变量，config/ 目录挂载属性路径映射。
# 底座自带 application-prod.yml 一行不改；实测见 docs/configuration.md「配置覆盖优先级」。
x-app-environment: &app-environment
  TZ: ${AGENTHUB_TZ:-Asia/Shanghai}
  # agenthub profile 必须排在 prod 之后：额外挂载目录 + 后置 profile 才压得动 classpath 明文默认值。
  SPRING_PROFILES_ACTIVE: ${AGENTHUB_SPRING_PROFILES_ACTIVE:-prod,agenthub}
  SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/config/
  # 容器内监听端口必须等于本栈口径（Nginx upstream 与健康探针同值），底座 yml 里写的是 8080，故显式覆盖。
  SERVER_PORT: "8081"
  # JVM 堆上限只能从这里压：容器不设内存限制，JVM 默认按宿主内存 25% 取堆，
  # 单机常驻时 app 会与 Milvus（实测常驻 2–2.5G）抢同一段物理内存，谁被 OOM 杀掉不看日志。
  JAVA_OPTS: ${AGENTHUB_APP_JAVA_OPTS:-}

  # ↓ 以下由 config/application-agenthub.yml 映射到底座既有属性路径（数据源、Redis、JWT、接口加解密）。
  AGENTHUB_DATASOURCE_URL: ${AGENTHUB_DATASOURCE_URL:-jdbc:mysql://db:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true&rewriteBatchedStatements=true&nullCatalogMeansCurrent=true}
  AGENTHUB_DATASOURCE_USERNAME: ${MYSQL_USER}
  AGENTHUB_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
  AGENTHUB_REDIS_HOST: redis
  AGENTHUB_REDIS_PORT: "6379"
  AGENTHUB_REDIS_PASSWORD: ${REDIS_PASSWORD}
  AGENTHUB_SA_TOKEN_JWT_SECRET_KEY: ${AGENTHUB_SA_TOKEN_JWT_SECRET_KEY:?生产必须替换底座默认 abcdefghijklmnopqrstuvwxyz}
  AGENTHUB_API_DECRYPT_PUBLIC_KEY: ${AGENTHUB_API_DECRYPT_PUBLIC_KEY:?生产必须替换仓库内明文公钥}
  AGENTHUB_API_DECRYPT_PRIVATE_KEY: ${AGENTHUB_API_DECRYPT_PRIVATE_KEY:?生产必须替换仓库内明文私钥}

  # ↓ AgentHub 自有配置，由 agent-hub-ai 侧属性类读取。
  # 生效里程碑：根密钥与守卫模式＝A2/A5（本周 D2）；向量库与对象存储＝A4 RAG 与附件（D3）。
  AGENTHUB_AI_CRYPTO_KEY: ${AGENTHUB_AI_CRYPTO_KEY:?模型密钥密文根密钥，见手册 §10.2 第 4 项}
  AGENTHUB_SECURITY_GUARD_MODE: ${AGENTHUB_SECURITY_GUARD_MODE:-prod}
  AGENTHUB_AI_CHAT_CURRENT_TIME_ZONE: ${AGENTHUB_AI_CHAT_CURRENT_TIME_ZONE:-Asia/Shanghai}
  AGENTHUB_AI_MILVUS_URI: http://milvus:19530
  AGENTHUB_AI_MILVUS_USERNAME: root
  AGENTHUB_AI_MILVUS_PASSWORD: ${MILVUS_PASSWORD}
  AGENTHUB_OBJECT_STORAGE_ENDPOINT: http://minio:9000
  AGENTHUB_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
  AGENTHUB_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

services:
  db:
    image: mysql:8.4
    # 中文菜单名与字典标签必须无损：mysqld 与初始化客户端都固定 utf8mb4，否则 132 条菜单落成乱码。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --mysqlx=0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?见 .env.example}
      MYSQL_USER: ${MYSQL_USER:?见 .env.example}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?生产必须替换}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?生产必须替换}
      TZ: ${AGENTHUB_TZ:-Asia/Shanghai}
    volumes:
      - agenthub-mysql-db:/var/lib/mysql
      # initdb 客户端字符集：缺这一行，底座基线的中文会把整条 initdb 链打断（文件内有实测说明）。
      - ./conf.d/agenthub.cnf:/etc/mysql/conf.d/agenthub.cnf:ro
      # initdb 按文件名顺序执行：底座基线 → AI 表结构 → 种子 → 菜单。
      # 底座基线随仓分发（MySQL 方言整理件，许可与出处见 docs/open-source-licenses.md）。
      - ../../code/back-end/script/sql/base/mysql/ruoyi-vue-base.sql:/docker-entrypoint-initdb.d/10-ruoyi-vue-base.sql:ro
      - ../../code/back-end/script/sql/base/mysql/ruoyi-job-base.sql:/docker-entrypoint-initdb.d/11-ruoyi-job-base.sql:ro
      - ../../code/back-end/script/sql/base/mysql/ruoyi-workflow-base.sql:/docker-entrypoint-initdb.d/12-ruoyi-workflow-base.sql:ro
      - ../../code/back-end/script/sql/mysql/agenthub-ai-ddl.sql:/docker-entrypoint-initdb.d/20-agenthub-ai-ddl.sql:ro
      - ../../code/back-end/script/sql/mysql/agenthub-ai-seed.sql:/docker-entrypoint-initdb.d/30-agenthub-ai-seed.sql:ro
      - ../../code/back-end/script/sql/mysql/agenthub-ai-menu.sql:/docker-entrypoint-initdb.d/40-agenthub-ai-menu.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?生产必须替换}
    volumes:
      - agenthub-mysql-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls=http://0.0.0.0:2379", "--data-dir", "/etcd"]
    volumes:
      - agenthub-mysql-etcd:/etcd
    healthcheck:
      # 必须用 exec 形式：quay.io/coreos/etcd 是 scratch 基座、镜像里没有 /bin/sh，
      # CMD-SHELL 会在 OCI runtime exec 阶段就失败，容器永远 unhealthy，把依赖 service_healthy 的 Milvus 连带卡死（云服务器起栈实测）。
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?见 .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?生产必须替换}
    volumes:
      - agenthub-mysql-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.5
    command: ["milvus", "run", "standalone"]
    environment:
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_SUPERUSERS: root
      MILVUS_USERNAME: root
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:?生产必须替换}
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - agenthub-mysql-milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9091' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  app:
    build:
      context: ../../code/back-end
      dockerfile: ${AGENTHUB_APP_DOCKERFILE:-Dockerfile}
    image: ${AGENTHUB_APP_IMAGE:-agenthub/app:local}
    environment: *app-environment
    volumes:
      # 配置覆盖目录：只放 application-agenthub.yml，密钥值一律留在 .env。
      - ./config:/config:ro
      # 长期记忆与工作区（`workspace-root=./data/agent-workspace`）按用户分目录落盘，
      # 挂命名卷才不会在一次 `compose up --force-recreate` 后把 MEMORY.md 与版本快照清零。
      - agenthub-mysql-logs:/app/logs
      - agenthub-mysql-workspace:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    # 8081 只在栈内被 Nginx 反代；宿主机映射供本地开发机直连，可按防火墙策略只放行内网。
    expose:
      - "8081"
    ports:
      - "${APP_HOST_PORT:-8081}:8081"
    healthcheck:
      # 健康自检 GET /ai/health/check 需 ai:health:check 鉴权（§12.3），容器探针只做端口就绪判断。
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  web:
    image: nginx:1.27
    volumes:
      - ./nginx/agenthub.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_DIST:-../../code/front-end/dist}:/usr/share/nginx/html:ro
      - ${CERT_DIR:-./cert}:/etc/nginx/cert:ro
    ports:
      - "${WEB_HTTP_PORT:-81}:81"
      - "${WEB_HTTPS_PORT:-8443}:8443"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agenthub-mysql-db:
  agenthub-mysql-redis:
  agenthub-mysql-etcd:
  agenthub-mysql-minio:
  agenthub-mysql-milvus:
  agenthub-mysql-logs:
  agenthub-mysql-workspace:
